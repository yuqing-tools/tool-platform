<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部工具平台</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f6fa; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { font-size: 2em; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 1em; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .tool-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .tool-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .tool-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); border-color: #667eea; }
        .tool-card-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px; }
        .tool-card-name { font-size: 1.2em; font-weight: bold; color: #333; margin-bottom: 6px; }
        .tool-card-desc { color: #666; font-size: 0.9em; line-height: 1.5; }
        .tool-card-meta { margin-top: 12px; font-size: 0.85em; color: #999; }
        .tool-detail { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: none; }
        .tool-detail.active { display: block; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #f5f6fa; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95em; color: #333; margin-bottom: 20px; }
        .back-btn:hover { background: #e4e6eb; }
        .tool-title { font-size: 1.5em; font-weight: bold; color: #333; margin-bottom: 8px; }
        .tool-meta { color: #888; font-size: 0.9em; margin-bottom: 20px; }
        .mode-section { margin-bottom: 20px; padding: 16px; background: #f8f9fa; border-radius: 12px; }
        .mode-title { font-weight: bold; color: #333; margin-bottom: 12px; }
        .mode-options { display: flex; gap: 20px; }
        .mode-option { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #333; }
        .mode-option input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }
        .upload-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .upload-box { background: white; border-radius: 12px; padding: 16px; border: 1px solid #eee; }
        .upload-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .upload-box-title { font-weight: bold; color: #333; }
        .upload-box-hint { font-size: 0.85em; color: #888; }
        .upload-area { border: 2px dashed #ddd; border-radius: 12px; padding: 30px 20px; text-align: center; transition: all 0.2s; cursor: pointer; }
        .upload-area:hover { border-color: #667eea; background: #f8f9ff; }
        .upload-icon { font-size: 32px; margin-bottom: 8px; }
        .upload-text { color: #666; font-size: 0.95em; }
        .file-preview { margin-top: 12px; }
        .file-preview-item { padding: 10px 12px; background: #f0fdf4; border-radius: 8px; border: 1px solid #bbf7d0; color: #166534; font-weight: 500; font-size: 0.9em; }
        .file-preview-empty { color: #ccc; text-align: center; padding: 10px; font-size: 0.9em; }
        .run-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .run-btn:hover { opacity: 0.9; }
        .run-btn:disabled { background: #ccc; cursor: not-allowed; }
        .progress-area { margin-top: 20px; display: none; }
        .progress-area.active { display: block; }
        .progress-bar { height: 8px; background: #e4e6eb; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); width: 0%; transition: width 0.3s; }
        .progress-text { color: #666; font-size: 0.9em; text-align: center; }
        .result-area { margin-top: 20px; padding: 20px; background: #f0fdf4; border-radius: 12px; display: none; }
        .result-area.active { display: block; }
        .result-title { font-weight: bold; color: #166534; margin-bottom: 12px; }
        .result-stats { margin-bottom: 16px; }
        .result-stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #bbf7d0; }
        .result-stat:last-child { border-bottom: none; }
        .download-btn { display: inline-block; padding: 12px 24px; background: #16a34a; color: white; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .download-btn:hover { background: #15803d; }
        .error-area { margin-top: 20px; padding: 16px; background: #fef2f2; border-radius: 12px; color: #dc2626; display: none; }
        .error-area.active { display: block; }
        .footer { text-align: center; padding: 30px 20px; color: #999; font-size: 0.85em; }
        .config-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .config-title { font-weight: bold; color: #333; margin-bottom: 12px; }
        .config-item { display: flex; justify-content: space-between; padding: 6px 0; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="header">
        <h1>内部工具平台</h1>
        <p>上传数据 · 在线处理 · 下载结果</p>
    </div>

    <div class="container">
        <div id="toolList" class="tool-list"><div class="loading">加载中...</div></div>

        <div id="toolDetail" class="tool-detail">
            <button class="back-btn" onclick="showToolList()">← 返回工具列表</button>
            <div class="tool-title" id="toolTitle">工具名称</div>
            <div class="tool-meta" id="toolMeta">v1.0 · 作者</div>

            <div class="mode-section">
                <div class="mode-title">处理模式</div>
                <div class="mode-options">
                    <label class="mode-option">
                        <input type="radio" name="classifyMode" value="normal" id="modeNormal">
                        <span>普通模式（数据已分类）</span>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="classifyMode" value="smart" id="modeSmart" checked>
                        <span>智能分类模式（自动识别关键词）</span>
                    </label>
                </div>
            </div>

            <div class="upload-section">
                <div class="upload-box">
                    <div class="upload-box-header">
                        <span class="upload-box-title">1. 今日数据</span>
                        <span class="upload-box-hint">系统24小时收藏的数据</span>
                    </div>
                    <div class="upload-area" id="uploadArea1" onclick="document.getElementById('fileInput1').click()">
                        <div class="upload-icon">📄</div>
                        <div class="upload-text">点击或拖拽上传</div>
                    </div>
                    <input type="file" id="fileInput1" style="display:none" accept=".xlsx,.xls">
                    <div class="file-preview" id="filePreview1"><div class="file-preview-empty">未上传文件</div></div>
                </div>

                <div class="upload-box">
                    <div class="upload-box-header">
                        <span class="upload-box-title">2. 待填表</span>
                        <span class="upload-box-hint">上个班次的成品表</span>
                    </div>
                    <div class="upload-area" id="uploadArea2" onclick="document.getElementById('fileInput2').click()">
                        <div class="upload-icon">📋</div>
                        <div class="upload-text">点击或拖拽上传</div>
                    </div>
                    <input type="file" id="fileInput2" style="display:none" accept=".xlsx,.xls">
                    <div class="file-preview" id="filePreview2"><div class="file-preview-empty">未上传文件</div></div>
                </div>
            </div>

            <button class="run-btn" id="runBtn" onclick="runTool()" disabled>开始处理</button>

            <div class="progress-area" id="progressArea">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText">处理中...</div>
            </div>

            <div class="result-area" id="resultArea">
                <div class="result-title">处理完成！</div>
                <div class="result-stats" id="resultStats"></div>
                <a class="download-btn" id="downloadBtn" download>下载结果文件</a>
            </div>

            <div class="error-area" id="errorArea"></div>

            <div class="config-section">
                <div class="config-title">工具配置</div>
                <div id="configList"></div>
            </div>
        </div>
    </div>

    <div class="footer"><p>内部工具平台 · 部门共享</p></div>

<script>
// ============ 全局变量 ============
let currentTool = null;
let todayDataFile = null;
let templateFile = null;
let processedWorkbook = null;
let classifyMode = true;

// ============ 工具配置 ============
const TOOLS_CONFIG = [{
    id: 'mengniu-sentiment',
    name: '蒙牛舆情数据整理工具',
    icon: '📊',
    description: '自动分类整理舆情数据，支持蒙牛/伊利/竞品/行业分类',
    version: 'v3.6',
    author: 'YLL',
    config: { '分类优先级': '标题优先 → 摘要补充', '竞品数量': '150+ 品牌' }
}];

// ============ 初始化 ============
document.addEventListener('DOMContentLoaded', () => {
    renderToolList();
    setupUploadEvents();
    document.querySelectorAll('input[name="classifyMode"]').forEach(radio => {
        radio.addEventListener('change', e => { classifyMode = e.target.value === 'smart'; });
    });
});

// ============ 工具列表 ============
function renderToolList() {
    const container = document.getElementById('toolList');
    container.innerHTML = TOOLS_CONFIG.map(tool => `
        <div class="tool-card" onclick="showToolDetail('${tool.id}')">
            <div class="tool-card-icon">${tool.icon}</div>
            <div class="tool-card-name">${tool.name}</div>
            <div class="tool-card-desc">${tool.description}</div>
            <div class="tool-card-meta">${tool.version} · ${tool.author}</div>
        </div>
    `).join('');
}

function showToolDetail(toolId) {
    currentTool = TOOLS_CONFIG.find(t => t.id === toolId);
    if (!currentTool) return;

    document.getElementById('toolList').style.display = 'none';
    document.getElementById('toolDetail').classList.add('active');
    document.getElementById('toolTitle').textContent = currentTool.name;
    document.getElementById('toolMeta').textContent = `${currentTool.version} · ${currentTool.author}`;

    const configList = document.getElementById('configList');
    configList.innerHTML = Object.entries(currentTool.config).map(([k, v]) =>
        `<div class="config-item"><span>${k}</span><span>${v}</span></div>`
    ).join('');

    todayDataFile = null;
    templateFile = null;
    classifyMode = true;
    document.getElementById('modeSmart').checked = true;
    document.getElementById('filePreview1').innerHTML = '<div class="file-preview-empty">未上传文件</div>';
    document.getElementById('filePreview2').innerHTML = '<div class="file-preview-empty">未上传文件</div>';
    document.getElementById('runBtn').disabled = true;
    document.getElementById('resultArea').classList.remove('active');
    document.getElementById('errorArea').classList.remove('active');
    document.getElementById('progressArea').classList.remove('active');
}

function showToolList() {
    document.getElementById('toolList').style.display = 'grid';
    document.getElementById('toolDetail').classList.remove('active');
}

// ============ 文件上传 ============
function setupUploadEvents() {
    const areas = ['uploadArea1', 'uploadArea2'];
    const inputs = ['fileInput1', 'fileInput2'];
    const handlers = [handleFile1, handleFile2];

    areas.forEach((areaId, i) => {
        const area = document.getElementById(areaId);
        area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
        area.addEventListener('dragleave', () => area.classList.remove('dragover'));
        area.addEventListener('drop', e => { e.preventDefault(); area.classList.remove('dragover'); if (e.dataTransfer.files[0]) handlers[i](e.dataTransfer.files[0]); });
        document.getElementById(inputs[i]).addEventListener('change', e => { if (e.target.files[0]) handlers[i](e.target.files[0]); });
    });
}

function handleFile1(file) {
    if (!file || !file.name.match(/\.(xlsx|xls)$/i)) return;
    todayDataFile = file;
    document.getElementById('filePreview1').innerHTML = `<div class="file-preview-item">${file.name}</div>`;
    updateRunButton();
}

function handleFile2(file) {
    if (!file || !file.name.match(/\.(xlsx|xls)$/i)) return;
    templateFile = file;
    document.getElementById('filePreview2').innerHTML = `<div class="file-preview-item">${file.name}</div>`;
    updateRunButton();
}

function updateRunButton() {
    document.getElementById('runBtn').disabled = !(todayDataFile && templateFile);
}

// ============ 文件读取 ============
function readFileAsync(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
}

function updateProgress(percent, text) {
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').textContent = text;
}

// ============ 运行工具 ============
async function runTool() {
    if (!currentTool || !todayDataFile || !templateFile) return;

    const runBtn = document.getElementById('runBtn');
    const progressArea = document.getElementById('progressArea');
    const resultArea = document.getElementById('resultArea');
    const errorArea = document.getElementById('errorArea');

    runBtn.disabled = true;
    progressArea.classList.add('active');
    resultArea.classList.remove('active');
    errorArea.classList.remove('active');

    try {
        updateProgress(10, '正在读取文件...');
        const data1 = await readFileAsync(todayDataFile);
        const todayWorkbook = XLSX.read(data1, { type: 'array', cellDates: true, cellStyles: true });

        updateProgress(30, '正在读取待填表...');
        const data2 = await readFileAsync(templateFile);
        const templateWorkbook = XLSX.read(data2, { type: 'array', cellDates: true, cellStyles: true });

        updateProgress(50, '正在处理数据...');
        const result = processMengniuTool(todayWorkbook, templateWorkbook, classifyMode);

        updateProgress(90, '正在生成结果...');
        processedWorkbook = result.workbook;

        updateProgress(100, '处理完成！');

        setTimeout(() => {
            progressArea.classList.remove('active');
            resultArea.classList.add('active');
            const statsHtml = Object.entries(result.stats).map(([k, v]) =>
                `<div class="result-stat"><span>${k}</span><span>${v} 条</span></div>`
            ).join('');
            document.getElementById('resultStats').innerHTML = statsHtml +
                `<div class="result-stat"><span>去重跳过</span><span>${result.skipped} 条</span></div>`;
        }, 500);

    } catch (err) {
        console.error(err);
        progressArea.classList.remove('active');
        errorArea.classList.add('active');
        errorArea.textContent = '处理出错：' + err.message;
    }

    runBtn.disabled = false;
}

// ============ 下载 ============
document.getElementById('downloadBtn').addEventListener('click', () => {
    if (processedWorkbook) {
        const today = new Date();
        const mmdd = String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
        const filename = `成品：蒙牛乳业舆情汇总${mmdd}.xlsx`;
        const wbout = XLSX.write(processedWorkbook, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }
});

// ============ 核心处理逻辑（完全按原Python工具实现） ============
function processMengniuTool(todayWorkbook, templateWorkbook, classifyMode) {
    // 读取今日数据
    const todaySheet = todayWorkbook.Sheets[todayWorkbook.SheetNames[0]];
    const todayData = XLSX.utils.sheet_to_json(todaySheet, { header: 1, defval: null });

    if (todayData.length <= 1) {
        throw new Error('今日数据为空！');
    }

    // 收集待填表中各sheet的现有URL（用于去重）
    const existingUrls = {
        '蒙牛（提及蒙牛的优先进蒙牛）': new Set(),
        '伊利': new Set(),
        '其他竞品': new Set(),
        '行业': new Set()
    };

    // 从待填表收集URL
    for (const sheetName of templateWorkbook.SheetNames) {
        if (sheetName === '数据统计（公式勿动）') continue;
        const sheet = templateWorkbook.Sheets[sheetName];
        const data = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            if (row && row[6]) {
                const normalized = normalizeUrl(String(row[6]));
                if (normalized) existingUrls[sheetName].add(normalized);
            }
        }
    }

    // 转换待填表中所有链接 https -> http
    for (const sheetName of templateWorkbook.SheetNames) {
        if (sheetName === '数据统计（公式勿动）') continue;
        const sheet = templateWorkbook.Sheets[sheetName];
        // 直接遍历sheet的单元格
        for (const cellAddr of Object.keys(sheet)) {
            if (cellAddr[0] === '!' ) continue; // 跳过内置属性
            const cell = sheet[cellAddr];
            if (cell && cell.t === 's' && cell.v && typeof cell.v === 'string' && cell.v.startsWith('https://')) {
                cell.v = cell.v.replace('https://', 'http://');
            }
        }
    }

    // 记录处理前各sheet的行数
    const rowCountsBefore = {};
    for (const sheetName of ['蒙牛（提及蒙牛的优先进蒙牛）', '伊利', '其他竞品', '行业']) {
        if (templateWorkbook.Sheets[sheetName]) {
            let count = 0;
            const sheet = templateWorkbook.Sheets[sheetName];
            for (let r = 2; ; r++) {
                const cellRef = `B${r}`;
                if (sheet[cellRef] && sheet[cellRef].v) {
                    count++;
                } else {
                    // 检查后面是否还有数据
                    let hasMore = false;
                    for (let rr = r + 1; rr < r + 10 && rr < 1000; rr++) {
                        if (sheet[`B${rr}`] && sheet[`B${rr}`].v) { hasMore = true; break; }
                    }
                    if (!hasMore) break;
                }
            }
            rowCountsBefore[sheetName] = count;
        } else {
            rowCountsBefore[sheetName] = 0;
        }
    }

    // 今日日期
    const today = new Date();
    const todayMM = String(today.getMonth() + 1).padStart(2, '0');
    const todayDD = String(today.getDate()).padStart(2, '0');
    const todayDateStr = `${today.getFullYear()}/${todayMM}/${todayDD}`;

    let skippedCount = 0;

    // 处理每行数据
    for (let i = 1; i < todayData.length; i++) {
        const row = todayData[i];
        if (!row || (!row[1] && !row[2])) continue; // 跳过空行

        const title = row[1];
        const summary = row[2];

        // 分类
        let category, brand;
        if (classifyMode) {
            ({ category, brand } = classifyByKeywords(title, summary));
        } else {
            const originalCategory = row[8];
            if (originalCategory === '蒙牛') {
                category = '蒙牛'; brand = null;
            } else if (originalCategory === '伊利') {
                category = '伊利'; brand = null;
            } else if (originalCategory === '行业') {
                category = '行业'; brand = null;
            } else if (originalCategory && originalCategory !== '蒙牛（提及蒙牛的优先进蒙牛）') {
                category = '竞品'; brand = originalCategory;
            } else {
                category = '行业'; brand = null;
            }
        }

        // 确定目标sheet
        let targetSheet;
        if (category === '蒙牛') {
            targetSheet = '蒙牛（提及蒙牛的优先进蒙牛）';
        } else if (category === '伊利') {
            targetSheet = '伊利';
        } else if (category === '竞品') {
            targetSheet = '其他竞品';
        } else {
            targetSheet = '行业';
        }

        if (!templateWorkbook.Sheets[targetSheet]) {
            console.warn(`警告：目标工作表 '${targetSheet}' 不存在，跳过`);
            continue;
        }

        const sheet = templateWorkbook.Sheets[targetSheet];

        // URL去重检查
        const currentUrl = row[6];
        if (currentUrl) {
            const normalized = normalizeUrl(String(currentUrl));
            if (normalized && existingUrls[targetSheet].has(normalized)) {
                skippedCount++;
                continue;
            }
            existingUrls[targetSheet].add(normalized);
        }

        // 找到最后一个有数据的行（从B列判断）
        let lastDataRow = 1;
        for (let r = 2; r < 10000; r++) {
            const cellRef = `B${r}`;
            if (sheet[cellRef] && sheet[cellRef].v) {
                lastDataRow = r;
            } else {
                // 再检查后面几行是否有数据
                let hasMore = false;
                for (let rr = r + 1; rr <= r + 5 && rr < 10000; rr++) {
                    if (sheet[`B${rr}`] && sheet[`B${rr}`].v) { hasMore = true; break; }
                }
                if (!hasMore) break;
            }
        }

        const newRow = lastDataRow + 1;
        const refRow = lastDataRow > 1 ? lastDataRow : 2;

        // 写入数据到各列（直接操作单元格）
        // A列：序号（暂不写，后面重新编号）
        // B列：标题
        sheet[`B${newRow}`] = { t: 's', v: row[1] || '' };
        // C列：摘要
        sheet[`C${newRow}`] = { t: 's', v: row[2] || '' };
        // D列：发布时间
        if (row[3]) {
            const pubTime = parseDatetime(row[3]);
            if (pubTime) {
                sheet[`D${newRow}`] = { t: 'd', v: pubTime, z: 'yyyy/mm/dd hh:mm:ss' };
            } else {
                sheet[`D${newRow}`] = { t: 's', v: String(row[3]) };
            }
        }
        // E列：发布人
        sheet[`E${newRow}`] = { t: 's', v: row[4] || '' };
        // F列：发布平台
        sheet[`F${newRow}`] = { t: 's', v: row[5] || '' };
        // G列：原文链接（https转http）
        const linkUrl = row[6] ? String(row[6]).replace('https://', 'http://') : '';
        sheet[`G${newRow}`] = { t: 's', v: linkUrl };
        // H列：报送时间（今天日期，只有日期部分）
        sheet[`H${newRow}`] = { t: 'd', v: new Date(today.getFullYear(), today.getMonth(), today.getDate()), z: 'yyyy/mm/dd' };
        // I列：情感属性
        sheet[`I${newRow}`] = { t: 's', v: row[7] || '' };
        // J列：不填
        // K列：竞品品类（仅竞品填）
        if (category === '竞品' && brand) {
            sheet[`K${newRow}`] = { t: 's', v: brand };
        }

        // 复制refRow的样式到新行
        for (let col = 0; col < 11; col++) {
            const colLetter = String.fromCharCode(65 + col); // A-K
            const newCellRef = `${colLetter}${newRow}`;
            const refCellRef = `${colLetter}${refRow}`;

            if (sheet[refCellRef] && sheet[refCellRef].s) {
                if (!sheet[newCellRef]) sheet[newCellRef] = {};
                sheet[newCellRef].s = sheet[refCellRef].s;
            }
        }
    }

    // 重新编号
    const targetSheets = ['蒙牛（提及蒙牛的优先进蒙牛）', '伊利', '其他竞品', '行业'];
    for (const sheetName of targetSheets) {
        if (!templateWorkbook.Sheets[sheetName]) continue;
        const sheet = templateWorkbook.Sheets[sheetName];

        let seq = 1;
        for (let r = 2; r < 10000; r++) {
            const cellRef = `B${r}`;
            if (sheet[cellRef] && sheet[cellRef].v) {
                sheet[`A${r}`] = { t: 'n', v: seq };
                seq++;
            } else {
                // 检查是否结束
                let hasMore = false;
                for (let rr = r + 1; rr <= r + 10 && rr < 10000; rr++) {
                    if (sheet[`B${rr}`] && sheet[`B${rr}`].v) { hasMore = true; break; }
                }
                if (!hasMore) break;
            }
        }
    }

    // 计算实际新增
    const stats = {};
    for (const sheetName of targetSheets) {
        if (!templateWorkbook.Sheets[sheetName]) continue;
        let count = 0;
        const sheet = templateWorkbook.Sheets[sheetName];
        for (let r = 2; r < 10000; r++) {
            const cellRef = `B${r}`;
            if (sheet[cellRef] && sheet[cellRef].v) {
                count++;
            } else {
                let hasMore = false;
                for (let rr = r + 1; rr <= r + 10 && rr < 10000; rr++) {
                    if (sheet[`B${rr}`] && sheet[`B${rr}`].v) { hasMore = true; break; }
                }
                if (!hasMore) break;
            }
        }
        const added = count - rowCountsBefore[sheetName];
        if (added > 0) {
            const displayName = sheetName === '蒙牛（提及蒙牛的优先进蒙牛）' ? '蒙牛' : sheetName;
            stats[displayName] = added;
        }
    }

    return { workbook: templateWorkbook, stats, skipped: skippedCount };
}

// ============ 工具函数 ============
function classifyByKeywords(title, summary) {
    const titleText = title || '';
    const summaryText = summary || '';

    for (const keyword of MENGNIU_KEYWORDS) {
        if (titleText.includes(keyword)) return { category: '蒙牛', brand: keyword };
    }
    for (const keyword of YILI_KEYWORDS) {
        if (titleText.includes(keyword)) return { category: '伊利', brand: keyword };
    }
    for (const [brand, keywords] of Object.entries(COMPETITOR_KEYWORDS)) {
        for (const keyword of keywords) {
            if (titleText.includes(keyword)) return { category: '竞品', brand };
        }
    }

    for (const keyword of MENGNIU_KEYWORDS) {
        if (summaryText.includes(keyword)) return { category: '蒙牛', brand: keyword };
    }
    for (const keyword of YILI_KEYWORDS) {
        if (summaryText.includes(keyword)) return { category: '伊利', brand: keyword };
    }
    for (const [brand, keywords] of Object.entries(COMPETITOR_KEYWORDS)) {
        for (const keyword of keywords) {
            if (summaryText.includes(keyword)) return { category: '竞品', brand };
        }
    }

    return { category: '行业', brand: null };
}

function normalizeUrl(url) {
    if (!url || typeof url !== 'string') return '';
    url = url.toLowerCase().trim();
    url = url.replace(/^https?:\/\//, '');
    url = url.replace(/^www\./, '');
    url = url.replace(/\/+$/, '');
    url = url.split('#')[0];
    return url;
}

function parseDatetime(timeStr) {
    if (!timeStr) return null;
    if (timeStr instanceof Date) return timeStr;

    const str = String(timeStr).trim();
    const dateMatch = str.match(/^(\d{4})[年/-](\d{1,2})[月/-](\d{1,2})/);
    if (dateMatch) {
        const [, year, month, day] = dateMatch;
        const timeMatch = str.match(/(\d{1,2}):(\d{1,2}):?(\d{0,2})?/);
        let hour = 0, minute = 0, second = 0;
        if (timeMatch) {
            hour = parseInt(timeMatch[1]) || 0;
            minute = parseInt(timeMatch[2]) || 0;
            second = parseInt(timeMatch[3]) || 0;
        }
        return new Date(year, month - 1, day, hour, minute, second);
    }
    return null;
}
